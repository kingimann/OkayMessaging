# Codemagic CI/CD configuration for Okay Messaging.
#
# The `test` workflow runs with NO setup in the Codemagic UI. The three build
# workflows import the "test" variable group, which must exist in the account:
# Codemagic rejects the whole file as "invalid configuration" when it
# references an environment group, keystore, or integration that doesn't exist
# yet. That group carries CERTIFICATE_PRIVATE_KEY (signing) and MAPBOX_TOKEN
# (the basemap) — a UI variable reaches a workflow only through its group.
#
# Workflows:
#   test           – analyze + the full test suite (Linux, fast)
#   android-build  – installable debug-signed APK (sideload it on a phone)
#   ios-release    – signed IPA to TestFlight (needs the App Store Connect
#                    integration + CERTIFICATE_PRIVATE_KEY; see
#                    docs/ios_signing_setup.md)
#   ios-simulator  – unsigned iOS build you can run in the Simulator
#
# The Android store-release workflow lives in docs/codemagic_release.yaml
# and needs a Play Console keystore before it can run.
#
# The bundle identifier is com.okaymessaging on both platforms; register
# that exact id in App Store Connect and the Play Console.
#
# The Supabase URL and publishable key below are client-safe by design
# (the publishable key is meant to ship inside the app), so they're inlined
# rather than hidden in a variable group you'd have to create.

workflows:
  # --- Fast feedback on every push / pull request ------------------------
  test:
    name: Analyze & test
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      flutter: stable
    triggering:
      events:
        - push
        - pull_request
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Unit & widget tests
        script: flutter test

  # --- Installable Android APK (no keystore needed) ----------------------
  # Debug-signed, so it installs on any phone with "install unknown apps"
  # enabled. Good enough to carry the app around and test it for real.
  android-build:
    name: Android APK (sideload)
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
      # MAPBOX_TOKEN lives in the "test" group in the Codemagic UI. A UI
      # variable reaches a workflow ONLY when its group is imported here —
      # without this line $MAPBOX_TOKEN expands to nothing and the build
      # quietly ships the free basemap.
      groups:
        - test
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Analyze & test
        script: |
          flutter analyze
          flutter test
      - name: Basemap
        script: |
          words=$(printf '%s' "$MAPBOX_TOKEN" | wc -w | tr -d ' ')
          if [ -z "$MAPBOX_TOKEN" ]; then
            echo "Basemap: OpenStreetMap - MAPBOX_TOKEN is empty (is it in the 'test' variable group?)"
          elif [ "$words" -gt 1 ]; then
            echo "Basemap: OpenStreetMap - MAPBOX_TOKEN is $words words, ${#MAPBOX_TOKEN} chars."
            echo "  Paste ONLY the pk. token. Anything around it splits the build command."
            exit 1
          else
            case "$MAPBOX_TOKEN" in
              pk.*) echo "Basemap: Mapbox (${#MAPBOX_TOKEN} chars)" ;;
              sk.*) echo "Basemap: OpenStreetMap - MAPBOX_TOKEN is a secret token; Mapbox needs the public pk. one" ;;
              *)    echo "Basemap: OpenStreetMap - MAPBOX_TOKEN is not a Mapbox token" ;;
            esac
          fi
      - name: Build APK
        script: |
          flutter build apk --debug \
            --dart-define=SUPABASE_URL=https://trbdqucphtsstnrwwfnw.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=sb_publishable_PrY-Aru0AryWyhHgfD2Tow_uXca1owt \
            --dart-define=STRIPE_PUBLISHABLE_KEY=pk_live_7XicY3iffHhInOt6LERz8uR9003yCOMM3P \
            --dart-define="MAPBOX_TOKEN=$MAPBOX_TOKEN" \
            --dart-define=REQUIRE_OTP=true
    artifacts:
      - build/**/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - ifakhargomi@gmail.com
        notify:
          success: true
          failure: true

  # --- Signed iOS build for TestFlight / the App Store --------------------
  # Uses the Apple Developer Portal integration named "OkayMessenger"
  # (App Store Connect API key) that's connected in Codemagic. Codemagic
  # issues the distribution certificate and provisioning profile itself.
  ios-release:
    name: iOS release (TestFlight)
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      # CERTIFICATE_PRIVATE_KEY lives in the "test" variable group in the
      # Codemagic UI. UI variables only reach a workflow when their group is
      # imported here, so this line is what makes @env:CERTIFICATE_PRIVATE_KEY
      # resolve during the signing step below.
      groups:
        - test
      vars:
        BUNDLE_ID: "com.okaymessaging"
    # `integrations` is a SIBLING of `environment`, never nested inside it.
    # Connecting the App Store Connect API key here exports the
    # APP_STORE_CONNECT_* env vars that the `app-store-connect` CLI below
    # picks up automatically to talk to Apple.
    integrations:
      app_store_connect: OkayMessenger
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Analyze & test
        script: |
          flutter analyze
          flutter test
      - name: Install CocoaPods
        script: |
          find . -name "Podfile" -execdir pod install \;
      # 'Target file "Who" not found' is what a build reports when one of the
      # variables below expands to something with a space in it: the shell
      # splits it into extra arguments and flutter reads a stray word as
      # --target. The message names a file nobody wrote and never mentions the
      # variable, so this prints the shape of each one first — length, word
      # count, and the opening characters, never the whole secret.
      - name: Check build inputs
        script: |
          bad=""
          for name in BUILD_NUMBER CM_COMMIT MAPBOX_TOKEN; do
            eval "val=\${$name:-}"
            words=$(printf '%s' "$val" | wc -w | tr -d ' ')
            echo "$name: ${#val} chars, $words words, starts '$(printf '%.6s' "$val")'"
            if [ "$words" -gt 1 ]; then
              echo "  ^^ this one has whitespace in it, and that is what breaks the build"
              bad=1
            fi
          done
          [ -z "$bad" ] || exit 1
          case "$MAPBOX_TOKEN" in
            "")   echo "Basemap: OpenStreetMap - MAPBOX_TOKEN is empty (is it in the 'test' variable group?)" ;;
            pk.*) echo "Basemap: Mapbox" ;;
            sk.*) echo "Basemap: OpenStreetMap - MAPBOX_TOKEN is a secret token; Mapbox needs the public pk. one" ;;
            *)    echo "Basemap: OpenStreetMap - MAPBOX_TOKEN is not a Mapbox token" ;;
          esac
      - name: Initialise the keychain
        script: keychain initialize
      # THE FIX. A brand-new app has no App Store provisioning profile, and
      # Codemagic's automatic `ios_signing` block only ever *fetches*
      # existing files — it never creates them — which is why every build so
      # far died with "No matching profiles found ... app_store".
      #
      # `fetch-signing-files ... --create` makes Apple ISSUE the missing
      # distribution certificate and App Store profile on the first run,
      # then reuses them afterwards. `--certificate-key` is the private key
      # the new certificate is signed with; add it once as a Codemagic
      # environment variable (see docs/ios_signing_setup.md).
      - name: Create or fetch the signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key="@env:CERTIFICATE_PRIVATE_KEY" \
            --create
      # THE FIX for the second failure. `fetch-signing-files` only downloads
      # the distribution certificate to disk; it does NOT put it in the
      # keychain. Without this import the archive signs, but the IPA *export*
      # dies with "exportArchive No signing certificate 'iOS Distribution'
      # found" — a false "successful" build with no artifact to publish.
      - name: Add the distribution certificate to the keychain
        script: keychain add-certificates
      - name: Set up provisioning profiles
        script: xcode-project use-profiles
      # Every App Store upload needs a build number higher than the last one
      # Apple accepted. agvtool doesn't survive `flutter build ipa` (which
      # reads the number from pubspec.yaml, so builds kept coming out as
      # "Build 1" and Apple rejects a duplicate). --build-number is the value
      # flutter actually uses; $BUILD_NUMBER is Codemagic's monotonic build
      # counter, so it always increases run to run.
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --build-name=1.1.2 \
            --build-number="$BUILD_NUMBER" \
            --dart-define="BUILD_STAMP=$CM_COMMIT" \
            --dart-define=SUPABASE_URL=https://trbdqucphtsstnrwwfnw.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=sb_publishable_PrY-Aru0AryWyhHgfD2Tow_uXca1owt \
            --dart-define=STRIPE_PUBLISHABLE_KEY=pk_live_7XicY3iffHhInOt6LERz8uR9003yCOMM3P \
            --dart-define="MAPBOX_TOKEN=$MAPBOX_TOKEN" \
            --dart-define=REQUIRE_OTP=true \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Uploads to TestFlight. Flip to true only when you're ready for
        # a real App Store review submission.
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - ifakhargomi@gmail.com
        notify:
          success: true
          failure: true

  # --- iOS build with NO Apple account or signing needed ------------------
  # Proves the iOS target compiles and gives you a Simulator build. Unzip
  # the artifact and drag Runner.app onto a running Simulator, or:
  #   xcrun simctl install booted Runner.app
  ios-simulator:
    name: iOS simulator build (no signing)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      # Same as the other builds: without the group import $MAPBOX_TOKEN is
      # empty and the simulator ships a different basemap than the phone.
      groups:
        - test
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Analyze & test
        script: |
          flutter analyze
          flutter test
      - name: Install CocoaPods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Basemap
        script: |
          words=$(printf '%s' "$MAPBOX_TOKEN" | wc -w | tr -d ' ')
          if [ -z "$MAPBOX_TOKEN" ]; then
            echo "Basemap: OpenStreetMap - MAPBOX_TOKEN is empty (is it in the 'test' variable group?)"
          elif [ "$words" -gt 1 ]; then
            echo "Basemap: OpenStreetMap - MAPBOX_TOKEN is $words words, ${#MAPBOX_TOKEN} chars."
            echo "  Paste ONLY the pk. token. Anything around it splits the build command."
            exit 1
          else
            case "$MAPBOX_TOKEN" in
              pk.*) echo "Basemap: Mapbox (${#MAPBOX_TOKEN} chars)" ;;
              sk.*) echo "Basemap: OpenStreetMap - MAPBOX_TOKEN is a secret token; Mapbox needs the public pk. one" ;;
              *)    echo "Basemap: OpenStreetMap - MAPBOX_TOKEN is not a Mapbox token" ;;
            esac
          fi
      - name: Build for the simulator (unsigned)
        script: |
          flutter build ios --simulator --debug \
            --dart-define=SUPABASE_URL=https://trbdqucphtsstnrwwfnw.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=sb_publishable_PrY-Aru0AryWyhHgfD2Tow_uXca1owt \
            --dart-define=STRIPE_PUBLISHABLE_KEY=pk_live_7XicY3iffHhInOt6LERz8uR9003yCOMM3P \
            --dart-define="MAPBOX_TOKEN=$MAPBOX_TOKEN" \
            --dart-define=REQUIRE_OTP=true
      - name: Zip the .app for download
        script: |
          cd build/ios/iphonesimulator
          zip -r $CM_BUILD_DIR/OkayMessaging-simulator.zip Runner.app
    artifacts:
      - OkayMessaging-simulator.zip
    publishing:
      email:
        recipients:
          - ifakhargomi@gmail.com
        notify:
          success: true
          failure: true
