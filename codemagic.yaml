# Codemagic CI/CD configuration for Okay Messaging.
#
# Every workflow here runs with NO setup in the Codemagic UI: no variable
# groups, no code-signing certificates, no App Store Connect key. That is
# deliberate — Codemagic rejects the whole file as "invalid configuration"
# when it references an environment group, keystore, or integration that
# doesn't exist in your account yet.
#
# Workflows:
#   test           – analyze + the full test suite (Linux, fast)
#   android-build  – installable debug-signed APK (sideload it on a phone)
#   ios-simulator  – unsigned iOS build you can run in the Simulator
#
# When you have a Play Console / Apple Developer account, add the signed
# store-release workflows from docs/codemagic_release.yaml — that file
# explains exactly which Codemagic resources each one needs first.
#
# The bundle identifier is com.okaymessaging on both platforms; register
# that exact id in App Store Connect and the Play Console.
#
# The Supabase URL and publishable key below are client-safe by design
# (the publishable key is meant to ship inside the app), so they're inlined
# rather than hidden in a variable group you'd have to create.

workflows:
  # --- Fast feedback on every push / pull request ------------------------
  test:
    name: Analyze & test
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      flutter: stable
    triggering:
      events:
        - push
        - pull_request
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Unit & widget tests
        script: flutter test

  # --- Installable Android APK (no keystore needed) ----------------------
  # Debug-signed, so it installs on any phone with "install unknown apps"
  # enabled. Good enough to carry the app around and test it for real.
  android-build:
    name: Android APK (sideload)
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Analyze & test
        script: |
          flutter analyze
          flutter test
      - name: Build APK
        script: |
          flutter build apk --debug \
            --dart-define=SUPABASE_URL=https://trbdqucphtsstnrwwfnw.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=sb_publishable_PrY-Aru0AryWyhHgfD2Tow_uXca1owt \
            --dart-define=REQUIRE_OTP=true
    artifacts:
      - build/**/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - ifakhargomi@gmail.com
        notify:
          success: true
          failure: true

  # --- Signed iOS build for TestFlight / the App Store --------------------
  # Uses the Apple Developer Portal integration named "OkayMessenger"
  # (App Store Connect API key) that's connected in Codemagic. Codemagic
  # issues the distribution certificate and provisioning profile itself.
  ios-release:
    name: iOS release (TestFlight)
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.okaymessaging"
    # `integrations` is a sibling of `environment`, never nested inside it.
    # Connecting the key here exports APP_STORE_CONNECT_* env vars that the
    # app-store-connect CLI below picks up automatically.
    integrations:
      app_store_connect: OkayMessenger
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Analyze & test
        script: |
          flutter analyze
          flutter test
      - name: Install CocoaPods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Set the build number from the Codemagic build counter
        script: |
          cd $CM_BUILD_DIR
          agvtool new-version -all $(($BUILD_NUMBER + 1)) || true
      # The environment's automatic `ios_signing` block only *fetches*
      # existing signing files, which fails on a brand-new app with:
      #   "No matching profiles found for bundle identifier ...".
      # Doing it explicitly with --create makes Apple issue the
      # distribution certificate and the App Store profile the first time.
      - name: Initialise the keychain
        script: keychain initialize
      # Creating a distribution certificate needs a private key to sign the
      # request with. Store it once in Codemagic as CERTIFICATE_PRIVATE_KEY
      # (see docs/ios_signing_setup.md) and every build reuses the same
      # certificate — Apple only allows a couple of them per account.
      - name: Create or fetch the signing files
        script: |
          if [ -z "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "CERTIFICATE_PRIVATE_KEY is not set."
            echo "See docs/ios_signing_setup.md — it takes one command."
            exit 1
          fi
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key="@env:CERTIFICATE_PRIVATE_KEY" \
            --create
      - name: Add the certificates to the keychain
        script: keychain add-certificates
      - name: Set up provisioning profiles
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --dart-define=SUPABASE_URL=https://trbdqucphtsstnrwwfnw.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=sb_publishable_PrY-Aru0AryWyhHgfD2Tow_uXca1owt \
            --dart-define=REQUIRE_OTP=true \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Uploads to TestFlight. Flip to true only when you're ready for
        # a real App Store review submission.
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - ifakhargomi@gmail.com
        notify:
          success: true
          failure: true

  # --- iOS build with NO Apple account or signing needed ------------------
  # Proves the iOS target compiles and gives you a Simulator build. Unzip
  # the artifact and drag Runner.app onto a running Simulator, or:
  #   xcrun simctl install booted Runner.app
  ios-simulator:
    name: iOS simulator build (no signing)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Analyze & test
        script: |
          flutter analyze
          flutter test
      - name: Install CocoaPods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Build for the simulator (unsigned)
        script: |
          flutter build ios --simulator --debug \
            --dart-define=SUPABASE_URL=https://trbdqucphtsstnrwwfnw.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=sb_publishable_PrY-Aru0AryWyhHgfD2Tow_uXca1owt \
            --dart-define=REQUIRE_OTP=true
      - name: Zip the .app for download
        script: |
          cd build/ios/iphonesimulator
          zip -r $CM_BUILD_DIR/OkayMessaging-simulator.zip Runner.app
    artifacts:
      - OkayMessaging-simulator.zip
    publishing:
      email:
        recipients:
          - ifakhargomi@gmail.com
        notify:
          success: true
          failure: true
