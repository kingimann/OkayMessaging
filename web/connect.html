<!DOCTYPE html>
<!--
  Stripe Connect embedded onboarding, hosted by this app.

  Loaded inside a WebView on a screen that has the app's own app bar, so
  setting up payments never leaves the app or opens a browser. Stripe's own
  forms render here, which is what keeps identity and banking details going
  straight to Stripe and never through this app.

  No client secret is in the URL. The host calls okayStart() once the page is
  up, and every Account Session after that is fetched over the message
  channel, so no secret ever reaches history or a log.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Set up payments</title>
<script src="https://connect-js.stripe.com/v1.0/connect.js"></script>
<style>
  :root { color-scheme: light dark; }
  html, body {
    margin: 0; padding: 0; background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #container { padding: 8px 12px 24px; }
  #status {
    padding: 40px 20px; text-align: center; font-size: 15px; color: #8b8f98;
    white-space: pre-wrap;
  }
  .spinner {
    width: 26px; height: 26px; margin: 0 auto 14px;
    border: 3px solid rgba(140,140,150,.25); border-top-color: #12b76a;
    border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="status"><div class="spinner"></div>Loading…</div>
<div id="container"></div>
<script>
  // Told to the host so it can close the screen and refresh the wallet.
  function notify(event) {
    try {
      if (window.OkayConnect && window.OkayConnect.postMessage) {
        window.OkayConnect.postMessage(event);
      }
    } catch (e) {}
  }

  var settled = false;

  // ---------------------------------------------------------------------
  // Which keys are actually in play
  //
  // "An error occurred while authenticating your account" is Stripe's wording
  // for a session the publishable key cannot authenticate, and it is a lie
  // about where the problem is: the account is fine, the two keys don't go
  // together. Either they are in different modes, or they belong to different
  // Stripe accounts, and both are set on a server nobody can see from here.
  //
  // So the page asks Stripe about the one key it holds. Posting a publishable
  // key to /v1/tokens with no other parameter creates nothing and answers with
  // a request_log_url that names the account the key belongs to — which is
  // half of the comparison, printed where somebody can read it. The key is
  // client-safe and this is the same endpoint Stripe.js uses; no user data is
  // in the request.
  var keyFacts = null;

  // The account the server's secret key belongs to, when the host is new
  // enough to say. Empty means the comparison can only be advised, not made.
  var serverAccount = '';

  function describeKey(pk) {
    if (!pk) return;
    var mode = pk.indexOf('pk_live_') === 0
      ? 'live'
      : (pk.indexOf('pk_test_') === 0 ? 'test' : '');
    keyFacts = { key: pk, mode: mode, account: '', unknownKey: false };
    try {
      fetch('https://api.stripe.com/v1/tokens', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'key=' + encodeURIComponent(pk)
      }).then(function (r) { return r.json(); }).then(function (j) {
        var err = (j && j.error) || {};
        // An unrecognised key is a cause on its own, not a detail.
        if (err.code === 'api_key_expired' ||
            (err.message || '').indexOf('Invalid API Key') >= 0) {
          keyFacts.unknownKey = true;
          return;
        }
        var m = /acct_[A-Za-z0-9]+/.exec(err.request_log_url || '');
        if (m) keyFacts.account = m[0];
      }).catch(function () {});
    } catch (e) {}
  }

  // What is worth adding under a failure message, or '' when nothing is known
  // yet. Deliberately says what to compare rather than naming a cause: the
  // other half of the comparison is a secret this page cannot see.
  function keyNote() {
    if (!keyFacts) return '';
    var tail = keyFacts.key.length > 4
      ? '…' + keyFacts.key.slice(-4)
      : keyFacts.key;
    if (keyFacts.unknownKey) {
      return '\n\nStripe does not recognise the publishable key this app was '
        + 'built with (' + tail + '). It has been rolled or deleted, so no '
        + 'session can authenticate against it.';
    }
    // Both halves known and different: this is the cause, not a thing to
    // check. Worth saying outright, because "an error occurred while
    // authenticating your account" has sent people to their bank details.
    if (keyFacts.account && serverAccount && keyFacts.account !== serverAccount) {
      return '\n\nThe two Stripe keys belong to different accounts. This app '
        + 'is built with a key from ' + keyFacts.account + ', while the '
        + 'server\'s STRIPE_SECRET_KEY belongs to ' + serverAccount + '. A '
        + 'session made by one account cannot be authenticated by the other. '
        + 'Set STRIPE_SECRET_KEY (Supabase → Edge Functions → Secrets) to an '
        + 'sk_' + keyFacts.mode + '_ key from ' + keyFacts.account + '.';
    }
    if (!keyFacts.mode) return '';
    var line = '\n\nThe app is using a ' + keyFacts.mode + '-mode publishable '
      + 'key (' + tail + ')';
    if (keyFacts.account) line += ', from Stripe account ' + keyFacts.account;
    line += '.\n\nFor Stripe to authenticate this form, STRIPE_SECRET_KEY in '
      + 'Supabase → Edge Functions → Secrets has to be an sk_' + keyFacts.mode
      + '_ key';
    line += keyFacts.account
      ? ' belonging to that same account.'
      : ' belonging to the same account.';
    return line;
  }

  function fail(message) {
    settled = true;
    var s = document.getElementById('status');
    s.style.display = '';
    s.textContent = message + keyNote();
    // The host shows the same words on its own screen, with a Try again
    // button. A message only the WebView knows is a message nobody can act on.
    notify('error:' + message);
  }

  function showedUi() {
    settled = true;
    document.getElementById('status').style.display = 'none';
  }

  // ---------------------------------------------------------------------
  // Client secrets
  //
  // connect.js calls fetchClientSecret again whenever the Account Session
  // expires, and Stripe's contract is that each call creates a NEW session.
  // This page used to hand back the same memoized secret every time, which
  // authenticates at most once and then fails with "An error occurred while
  // authenticating your account" — with the component left spinning, because
  // nothing else ever resolves.
  //
  // So the page owns no secret at all: it asks the host, which mints one from
  // payments-account-session and answers on okaySecret().
  // ---------------------------------------------------------------------
  var pending = {};
  var nextId = 1;
  var initialSecret = '';
  var initialUsed = false;
  var hostAnswers = false;

  function requestSecret() {
    // The secret the host handed over at start-up was minted seconds ago, so
    // the first authentication uses it. That also keeps this page working
    // against app versions that predate the message channel below — a page is
    // deployed the moment it is pushed, while a build reaches a phone days
    // later, so the two must never require each other.
    if (initialSecret && !initialUsed) {
      initialUsed = true;
      return Promise.resolve(initialSecret);
    }
    return new Promise(function (resolve, reject) {
      var id = String(nextId++);
      // Whatever goes wrong here, say it on the page AND to the host before
      // rejecting: connect.js discards the rejection reason and paints its own
      // "An error occurred while authenticating your account", which points at
      // the account when the truth is that no new session arrived.
      function refuse(message) {
        fail(message);
        reject(new Error(message));
      }
      var timer = setTimeout(function () {
        if (!pending[id]) return;
        delete pending[id];
        refuse(hostAnswers
          ? 'The app took too long to start a new Stripe session.'
          : 'This version of the app cannot refresh the Stripe session. '
            + 'Update the app and try again.');
      }, 15000);
      pending[id] = function (secret, reason) {
        clearTimeout(timer);
        hostAnswers = true;
        if (secret) resolve(secret);
        // The host says why when it knows; its reason beats this fallback,
        // which only knows that nothing came back.
        else refuse(reason || 'The app could not start a Stripe session.');
      };
      notify('secret:' + id);
    });
  }

  // Answered by the host, one call per 'secret:<id>' it hears.
  window.okaySecret = function (id, secret, reason) {
    var done = pending[String(id)];
    if (!done) return;
    delete pending[String(id)];
    done(secret, reason);
  };

  // The loader exposes StripeConnect.init — NOT .initialize, which is the npm
  // package's name. Checking for the wrong one made the page give up before
  // it ever called Stripe, reporting "could not reach Stripe" while Stripe
  // was sitting there loaded.
  //
  // StripeConnect.onLoad is the loader's own ready hook: set it before the
  // script finishes and it fires when init exists. That removes the race
  // between the host calling in and the CDN script arriving.
  window.StripeConnect = window.StripeConnect || {};

  function mount(publishableKey, dark, accent) {
    try {
      var instance = window.StripeConnect.init({
        publishableKey: publishableKey,
        fetchClientSecret: requestSecret,
        appearance: {
          overlays: 'dialog',
          variables: {
            colorPrimary: accent || '#12b76a',
            colorBackground: dark ? '#121417' : '#ffffff',
            colorText: dark ? '#e8eaed' : '#1a1c1e',
            colorSecondaryText: dark ? '#9aa0a6' : '#5f6368',
            borderRadius: '12px',
            fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif'
          }
        }
      });
      var onboarding = instance.create('account-onboarding');
      onboarding.setOnExit(function () { notify('exit'); });
      // Stripe's own reason for a failure, instead of the red box inside the
      // component that says only "please try again". Guarded because these
      // two setters are newer than setOnExit.
      if (onboarding.setOnLoadError) {
        onboarding.setOnLoadError(function (e) {
          var err = (e && e.error) || {};
          fail(err.message || 'Stripe could not load the setup form. (' +
            (err.type || 'unknown') + ')');
        });
      }
      // Hide the spinner when the component actually paints, not when it is
      // appended — appending is instant and told the user everything was fine
      // while the frame behind it was failing to authenticate.
      if (onboarding.setOnLoaderStart) {
        onboarding.setOnLoaderStart(showedUi);
      } else {
        showedUi();
      }
      document.getElementById('container').appendChild(onboarding);
      notify('ready');
      setTimeout(function () {
        if (!settled) fail('Stripe did not finish loading. Close this and try again.');
      }, 30000);
    } catch (e) {
      fail('Could not start setup: ' + (e && e.message ? e.message : e));
    }
  }

  // Called by the host once the page has loaded, so no secret is ever in a URL.
  var started = false;
  window.okayStart = function (clientSecret, publishableKey, dark, accent,
      platformAccount) {
    if (started) return;
    started = true;
    initialSecret = clientSecret || '';
    // Absent from hosts older than this argument, which is why nothing below
    // requires it.
    serverAccount = platformAccount || '';
    // Asked about now, so the answer is in hand if anything fails later.
    describeKey(publishableKey);
    // A missing or malformed key is worth catching here: handing '' to
    // StripeConnect.init produces the same "authenticating your account"
    // message as a mismatched key, and sends people to look at their bank
    // details for a build-configuration problem.
    if (!publishableKey || publishableKey.indexOf('pk_') !== 0) {
      fail(publishableKey
        ? 'This app was built with something that is not a Stripe '
          + 'publishable key, so Stripe has nothing to authenticate against.'
        : 'This app has no Stripe publishable key, so Stripe has nothing to '
          + 'authenticate against. (STRIPE_PUBLISHABLE_KEY at build time, or '
          + 'as an Edge Function secret.)');
      return;
    }
    if (window.StripeConnect.init) {
      mount(publishableKey, dark, accent);
      return;
    }
    // Script still in flight — hand Stripe the callback instead of failing.
    window.StripeConnect.onLoad = function () {
      mount(publishableKey, dark, accent);
    };
  };

  // If the host never calls in, say so rather than spinning forever.
  setTimeout(function () {
    if (!started) fail('Setup did not start. Close this and try again.');
  }, 20000);
</script>
</body>
</html>
