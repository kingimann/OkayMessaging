<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="OkayMessenger">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>OkayMessenger</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Deployments must reach users on their NEXT visit, not two visits later.
    Flutter's service worker caches the whole app; by default a new version
    installs but sits "waiting" until every tab is closed, so phones keep
    running stale (and, mid-deploy, mixed) builds. This activates a waiting
    update immediately and reloads once so the fresh build takes over.
  -->
  <script>
    (function () {
      if (!('serviceWorker' in navigator)) return;
      var reloaded = false;
      // Only reload for *updates*: on a first visit the page has no
      // controller yet, and that initial claim must not trigger a reload.
      var hadController = !!navigator.serviceWorker.controller;
      function activate(reg) {
        if (reg && reg.waiting) {
          reg.waiting.postMessage('skipWaiting');
        }
      }
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (!hadController) { hadController = true; return; }
        if (reloaded) return;
        reloaded = true;
        window.location.reload();
      });
      window.addEventListener('load', function () {
        navigator.serviceWorker.getRegistration().then(function (reg) {
          if (!reg) return;
          activate(reg);
          reg.addEventListener('updatefound', function () {
            var sw = reg.installing;
            if (!sw) return;
            sw.addEventListener('statechange', function () {
              if (sw.state === 'installed') activate(reg);
            });
          });
          // Also ask the browser to check for a newer build right now.
          reg.update().catch(function () {});
        });
      });
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
