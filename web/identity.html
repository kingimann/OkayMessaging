<!DOCTYPE html>
<!--
  Stripe Identity, hosted by this app.

  Loaded inside a WebView on a screen with the app's own app bar, so the ID
  check never leaves the app. Stripe.js runs the whole flow — the document
  photos and the selfie go straight to Stripe and are never seen, uploaded, or
  stored by this app. All we ever learn is whether the check passed.

  The client secret arrives by function call after load, so it never appears
  in a URL or in any log of one.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verify your identity</title>
<script src="https://js.stripe.com/v3/"></script>
<style>
  :root { color-scheme: light dark; }
  html, body {
    margin: 0; padding: 0; background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #status { padding: 44px 24px; text-align: center; font-size: 15px; color: #8b8f98; }
  .spinner {
    width: 26px; height: 26px; margin: 0 auto 14px;
    border: 3px solid rgba(140,140,150,.25); border-top-color: #1d9bf0;
    border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="status"><div class="spinner"></div>Loading…</div>
<script>
  function notify(event) {
    try {
      if (window.OkayConnect && window.OkayConnect.postMessage) {
        window.OkayConnect.postMessage(event);
      }
    } catch (e) {}
  }
  function say(message) { document.getElementById('status').textContent = message; }
  function fail(message) { say(message); notify('error'); }

  window.okayStart = function (clientSecret, publishableKey, dark, accent) {
    if (!window.Stripe) {
      fail('Could not reach Stripe. Check your connection and try again.');
      return;
    }
    var stripe = window.Stripe(publishableKey);
    if (!stripe.verifyIdentity) {
      fail('Identity verification is not enabled on this account yet.');
      return;
    }
    say('Opening the ID check…');
    notify('ready');
    stripe.verifyIdentity(clientSecret).then(function (result) {
      if (result && result.error) {
        // A cancel is not an error worth shouting about.
        if (result.error.code === 'consent_declined' ||
            result.error.code === 'session_cancelled') {
          notify('exit');
          return;
        }
        fail(result.error.message || 'Verification could not be completed.');
        return;
      }
      // Submitted. Stripe decides asynchronously and tells the server by
      // webhook; the app re-reads the verdict rather than trusting this.
      say('Thanks — we’ll let you know once it’s checked.');
      notify('submitted');
    }).catch(function (e) {
      fail('Verification could not be started: ' + (e && e.message ? e.message : e));
    });
  };

  setTimeout(function () {
    var s = document.getElementById('status');
    if (s && s.textContent.indexOf('Loading') === 0) {
      fail('Verification did not start. Close this and try again.');
    }
  }, 20000);
</script>
</body>
</html>
