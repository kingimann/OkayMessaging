name: okay_messaging
description: "A WhatsApp-style messaging app built with Flutter. Phone-number login; all chats are stored locally on the device."
publish_to: 'none'
version: 1.1.2+2

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  intl: ^0.19.0
  shared_preferences: ^2.2.0
  # Cryptography for the end-to-end message encryption layer:
  #  - crypto: SHA-256 / HMAC (key derivation, fingerprints)
  #  - pointycastle: AES-256-GCM (AEAD) + HKDF + P-256 ECDH key agreement
  crypto: ^3.0.0
  pointycastle: ^4.0.0
  # The iOS Keychain / Android Keystore, for the crown jewels: the identity
  # private key, ratchet sessions and sender-key chains. SharedPreferences
  # is an NSUserDefaults plist that rides device backups in the clear —
  # keychain items are hardware-protected and stay on the device.
  flutter_secure_storage: ^9.2.2
  # Used ONLY for Realtime broadcast (ephemeral pub/sub). No database tables,
  # no auth, no stored messages — the relay just passes messages through.
  supabase_flutter: ^2.5.0
  qr_flutter: ^4.1.0
  flutter_webrtc: ^1.5.2
  google_mobile_ads: ^6.0.0
  file_picker: ^11.0.2
  video_player: ^2.9.2
  image: ^4.3.0
  path_provider: ^2.1.6
  # Voice notes: capture with the mic (record), play back (audioplayers).
  # Mic permission already ships for calls (NSMicrophoneUsageDescription /
  # RECORD_AUDIO). Both packages support iOS/Android/web.
  record: ^5.1.2
  audioplayers: ^6.1.0
  # record 5.x lets record_platform_interface float to 1.6.0 but pins
  # record_linux <1.0.0, whose 0.7.2 predates the interface's startStream /
  # hasPermission(request:) — the mismatch fails kernel_snapshot on EVERY
  # platform's release build (the Dart plugin registrant compiles all
  # platform implementations). record_linux 1.3.1 implements interface
  # ^1.5.0 and 1.6.0 added no abstract members, so it closes the gap.
  # (Override lives at the bottom of this file.)
  # Browser interop (Web Share API + downloads) for saving the encrypted chat
  # backup on the web build. Guarded by a conditional import.
  web: ^1.1.0
  # System share sheet, used only on mobile to send an encrypted chat backup to
  # iCloud Drive / Dropbox / Google Drive / Files (guarded by a conditional
  # import so the web build never references it).
  share_plus: ^10.1.4
  # Native card / Apple Pay / Google Pay sheet for in-chat (peer-to-peer)
  # payments only. Used on mobile (guarded by a conditional import so the web
  # build stays clean).
  flutter_stripe: ^11.1.0
  # Apple / Google in-app purchases. Digital goods — the cloud-storage
  # subscription and tipping the developer — MUST bill through the platform
  # store, not Stripe. Guarded by a conditional import so the web build never
  # references it.
  in_app_purchase: ^3.2.0
  # Opens the Stripe-hosted Express onboarding (KYC) link in an in-app browser.
  url_launcher: ^6.2.0
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  http: ^1.6.0
  geolocator: ^14.0.2
  flutter_map_cancellable_tile_provider: ^3.1.1
  # Contact sync (mobile only, guarded by kIsWeb): reads the device address
  # book to find which contacts already use the app; only SHA-256 hashes of
  # phone numbers ever leave the device. MUST stay on 2.x — 1.x force-unwraps
  # UIApplication.shared.delegate.window at plugin registration, which is nil
  # under the scene lifecycle this app uses, crashing iOS instantly at launch.
  flutter_contacts: ^2.3.0
  webview_flutter: ^4.14.1
  webview_flutter_wkwebview: ^3.26.0
  random_avatar: ^0.0.8
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.4

# See the note above `record:` — record 5.x's own constraints resolve to an
# incompatible record_linux, and this is the pub-sanctioned way past a
# publisher's stale pin. Drop this when record is bumped to 7.x (whose
# federated set is self-consistent).
dependency_overrides:
  record_linux: 1.3.1

# Native launch screen. Regenerate after changing the art with:
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0E181C"
  image: assets/icon/splash_logo.png
  android_12:
    color: "#0E181C"
    image: assets/icon/splash_logo.png
  android: true
  ios: true
  web: false

# App launcher icons. Regenerate after changing the source art with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 23
  adaptive_icon_background: "#0E181C"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  web:
    generate: true
    background_color: "#0E181C"
    theme_color: "#0E181C"

flutter:
  uses-material-design: true

  # CocoaPods for every iOS plugin. google_mobile_ads is pods-only but
  # depends on webview_flutter_wkwebview, which Flutter otherwise routes
  # through Swift Package Manager — the pod resolver then can't find its
  # spec and the archive dies at `pod install` (seen live 2026-08-04).
  # One dependency manager beats two half-used ones; drop this only when
  # google_mobile_ads itself adopts SPM.
  config:
    enable-swift-package-manager: false

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
