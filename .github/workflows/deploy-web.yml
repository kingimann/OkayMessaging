name: Deploy web to GitHub Pages

on:
  push:
    # main only. A feature branch used to be listed here too, which meant a
    # push to it published over whatever main had deployed — the live site
    # showing work nobody had merged, from a branch long since abandoned.
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      # An unset MAPBOX_TOKEN builds a working map from the free servers, so
      # the deploy succeeds and nothing anywhere says the basemap is not the
      # one that was asked for. Say it in the log.
      - name: Basemap
        env:
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
        run: |
          case "$MAPBOX_TOKEN" in
            pk.*) echo "Basemap: Mapbox" ;;
            "")   echo "Basemap: OpenStreetMap — no MAPBOX_TOKEN secret (Settings -> Secrets and variables -> Actions)" ;;
            sk.*) echo "Basemap: OpenStreetMap — MAPBOX_TOKEN is a secret token; Mapbox needs the public pk. one" ;;
            *)    echo "Basemap: OpenStreetMap — MAPBOX_TOKEN is not a Mapbox token" ;;
          esac

      # base-href must match the project-site path: https://<user>.github.io/OkayMessaging/
      # The Supabase values enable the store-nothing message relay (Realtime
      # broadcast only — no database, no tables). SUPABASE_ANON_KEY is a
      # *publishable* key: it is designed to be shipped in the client bundle,
      # so it is provided here as a build arg rather than a secret.
      # NOTE: --wasm (skwasm) was tried for Chrome speed but broke loading on
      # iPhone Safari, so the deploy ships the universally-compatible JS build.
      - name: Build web
        run: |
          flutter build web --release --base-href "/OkayMessaging/" \
            --no-web-resources-cdn \
            --dart-define=SUPABASE_URL=https://trbdqucphtsstnrwwfnw.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=sb_publishable_PrY-Aru0AryWyhHgfD2Tow_uXca1owt \
            --dart-define=STRIPE_PUBLISHABLE_KEY=pk_live_7XicY3iffHhInOt6LERz8uR9003yCOMM3P \
            --dart-define=REQUIRE_OTP=true \
            --dart-define=MAPBOX_TOKEN="${{ secrets.MAPBOX_TOKEN }}" \
            --dart-define=KLIPY_API_KEY="${{ secrets.KLIPY_API_KEY }}" \
            --dart-define=BUILD_STAMP="${GITHUB_SHA::7} $(date -u +%Y-%m-%d)"

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
